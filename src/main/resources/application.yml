spring:
  application:
    name: mobility-and-ev-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Per-instance provider protection; shared by discovery lists and place readers.
# Places discovery/explore is off: its uncached photo lookups exceeded the Google free tier
# (Oct 2026). Set enabled: true only with a cache and a Google Cloud daily quota in place.
navio:
  discovery:
    enabled: false
    requests-per-minute: 60
    max-concurrent: 4
  # Google calls stop for the rest of the month once a meter reaches its limit (ev.provider_monthly_usage).
  # Defaults sit ~5% under each free tier; override with monthly-limits.<METER> (see GoogleUsageMeter).
  google:
    free-tier:
      enabled: true
