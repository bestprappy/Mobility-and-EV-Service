spring:
  cloud:
    bus:
      enabled: false
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:h2:mem:mobility;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    enabled: false

navio:
  mobility:
    providers:
      google-maps:
        api-key: test-google-api-key
        places:
          base-url: https://places.googleapis.test/v1
          connect-timeout: 100ms
          read-timeout: 500ms
        routes:
          base-url: https://routes.googleapis.test/directions/v2:computeRoutes
          connect-timeout: 100ms
          read-timeout: 500ms
        cache:
          place-fresh-ttl: 1m
          place-stale-ttl: 5m
          route-fresh-ttl: 1m
          route-stale-ttl: 5m
          maximum-size: 100
