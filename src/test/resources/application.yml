spring:
  cloud:
    bus:
      enabled: false
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:h2:mem:mobility;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    enabled: false
